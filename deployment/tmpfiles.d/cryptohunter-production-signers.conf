# Reviewed installation input only. No private keys or metadata are created.
# Setgid runtime directories let signer sockets inherit the issuer group;
# signer processes retain their own primary group and no issuer membership.
d /run/cryptohunter 0755 root root -
d /run/cryptohunter/root-proof-signer 2710 cryptohunter-root-proof-signer cryptohunter-root-proof-issuer -
d /run/cryptohunter/history-attestation-signer 2710 cryptohunter-history-attestation-signer cryptohunter-root-proof-issuer -
d /var/lib/cryptohunter 0755 root root -
d /var/lib/cryptohunter/root-proof-signer 0700 cryptohunter-root-proof-signer cryptohunter-root-proof-signer -
d /var/lib/cryptohunter/history-attestation-signer 0700 cryptohunter-history-attestation-signer cryptohunter-history-attestation-signer -
d /etc/cryptohunter/root-proof-signer 0750 root cryptohunter-root-proof-signer -
d /etc/cryptohunter/history-attestation-signer 0750 root cryptohunter-history-attestation-signer -
