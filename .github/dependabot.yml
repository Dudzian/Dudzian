version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Atlantic/Reykjavik
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui/desktop
    schedule:
      interval: monthly
      time: "04:15"
      timezone: Atlantic/Reykjavik
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      desktop-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Atlantic/Reykjavik
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      actions:
        patterns: ["*"]
