version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Atlantic/Reykjavik
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui/desktop
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Atlantic/Reykjavik
    open-pull-requests-limit: 5
    groups:
      desktop-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Atlantic/Reykjavik
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
