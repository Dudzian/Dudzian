name: Style preflight

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: style-preflight-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff-format:
    name: Ruff format (all tracked files)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install formatting preflight runner
        run: python -m pip install "pre-commit>=4,<5"
      - name: Check exact CI Ruff formatting scope
        run: python -m pre_commit run ruff-format --all-files --show-diff-on-failure
