  # Only this job owns the original aggregate changed-code coverage ratchet.
  # Merge raw coverage.py branch data, never average percentages or fake XML.
  quality-ratchet-coverage:
    name: Quality ratchet (combined coverage gate)
    runs-on: ubuntu-latest
    needs: [quality-ratchet, quality-ratchet-postgresql]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install coverage and changed-code gate
        run: python -m pip install -e ".[test]" "diff-cover>=9,<10"
      - name: Download baseline coverage data
        uses: actions/download-artifact@v8
        with:
          name: quality-ratchet-base-data
          path: coverage-parts
      - name: Download PostgreSQL coverage data
        uses: actions/download-artifact@v8
        with:
          name: quality-ratchet-postgresql-data
          path: coverage-parts
      - name: Merge original branch coverage without losing either shard
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage-parts/coverage-quality-base.data
          test -s coverage-parts/coverage-quality-postgresql.data
          mv coverage-parts/coverage-quality-base.data coverage-parts/.coverage.base
          mv coverage-parts/coverage-quality-postgresql.data coverage-parts/.coverage.postgresql
          python -m coverage combine --keep coverage-parts
          python -m coverage xml -o coverage.xml
          test -s coverage.xml
      - name: Changed-code coverage ratchet
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch "origin/${{ github.base_ref }}" --fail-under=70
      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-ratchet-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

