name: Quality and Security

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  schedule:
    - cron: "20 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BETTERLEAKS_1_9_0_LINUX_X64_SHA256: "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7"

jobs:
  quality-ratchet:
    name: Quality ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-unsafe:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-other:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare isolated PostgreSQL durability-refusal fixture
        run: |
          docker exec '${{ job.services.postgres-unsafe.id }}' psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'ALTER SYSTEM SET fsync = off' -c 'SELECT pg_reload_conf()'
          observed_fsync="$(docker exec '${{ job.services.postgres-unsafe.id }}' psql -U postgres -d postgres -v ON_ERROR_STOP=1 -At -c 'SHOW fsync')"
          test "$observed_fsync" = "off"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install test and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "ruff==0.14.11" "mypy==1.10.0" "diff-cover>=9,<10"
      - name: Ruff baseline gate
        run: python -m ruff check bot_core core scripts tests deploy stage6_samples ui deployment/production_signer_service.py deployment/windows_production_cha_operation.py deployment/windows_production_cha_account_reservation.py deployment/windows_runner_acl.py deployment/windows_stage9_handoff.py deployment/windows_stage9_host_inspection.py deployment/windows_stage9_postgresql_passive.py deployment/windows_stage9_evidence_pipe.py deployment/windows_stage9_service_sql.py deployment/windows_stage9_service_evidence.py deployment/windows_installer/service_base.py deployment/windows_installer/backend_service.py deployment/windows_installer/verifier_service.py deployment/windows_postgresql_auth_contract.py deployment/windows_stage9_install_preparation.py deployment/windows_stage9_install_executor.py deployment/windows_stage9_install_native.py deployment/windows_stage9_install_qualification.py deployment/windows_stage9_operator_approval.py deployment/windows_stage10_preflight.py deployment/windows_stage10_artifact_preflight.py deployment/windows_stage10_runner_preflight.py deployment/platform_evidence.py
      - name: Format Stage 9 signing and credential substrate
