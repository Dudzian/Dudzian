name: Quality and Security

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  schedule:
    - cron: "20 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BETTERLEAKS_1_9_0_LINUX_X64_SHA256: "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7"

jobs:
  quality-ratchet:
    name: Quality ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install test and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "ruff==0.14.11" "mypy==1.10.0" "diff-cover>=9,<10"
      - name: Ruff baseline gate
        run: python -m ruff check bot_core core scripts tests deploy stage6_samples ui deployment/windows_production_cha_operation.py deployment/windows_production_cha_account_reservation.py
      - name: Format Stage 9 signing and credential substrate
        run: >-
          python -m ruff format --check
          bot_core/postgresql_preaccount_credentials.py
          bot_core/postgresql_root_proof_issuance_authority.py
          bot_core/cha_attempt_store.py
          bot_core/cha_attempt_signatures.py
          bot_core/cha_issuance_request.py
          bot_core/cha_root_proof_signing_custody.py
          bot_core/licensing/cha_root_proof_signed_attempt.py
          tests/architecture/test_stage9_root_proof_preaccount_credentials_contract.py
          tests/architecture/test_stage9_root_proof_signed_immutable_attempt_contract.py
          tests/licensing/test_cha_root_proof_signed_attempt.py
          tests/security/test_native_custody_locking.py
          tests/security/test_postgresql_preaccount_credential_contract.py
          tests/security/test_postgresql_preaccount_credentials_integration.py
          tests/security/test_postgresql_root_proof_issuance_authority.py
          tests/security/test_cha_signed_attempt_postgresql.py
      - name: Mypy configured scope
        run: python -m mypy
      - name: Mypy Windows configured scope
        run: python -m mypy --platform win32
      - name: Property and critical pure-logic tests with branch coverage
        env:
          HYPOTHESIS_PROFILE: ci
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DUDZIAN_TEST_MODE: "1"
          DUDZIAN_ALLOW_LONG_POLL: "0"
        run: >-
          python -m pytest -p asyncio -p pytest_cov -p xdist.plugin -n 4
          tests/property
          tests/test_risk_portfolio_management.py
          tests/deployment/test_windows_tpm_substrate_probe.py
          tests/licensing/test_pre_enrollment.py
          tests/licensing/test_pdsa_enrollment_challenge.py
          tests/licensing/test_production_tpm_custody.py
          tests/licensing/test_production_pre_enrollment.py
          tests/licensing/test_pdsa_enrollment_authorization.py
          tests/licensing/test_external_provisioning_stage9.py
          tests/licensing/test_production_pdsa_verifier.py
          tests/licensing/test_lppi_authority_lifecycle.py
          tests/licensing/test_lppi_authenticated_operation.py
          tests/licensing/test_lppi_authenticated_operation_native.py
          tests/licensing/test_lppi_authenticated_operation_durability.py
          tests/licensing/test_cha_logical_operation.py
          tests/licensing/test_cha_logical_operation_durability.py
          tests/deployment/test_windows_cng_pre_enrollment.py
          tests/deployment/test_windows_cng_custody_bridge.py
          tests/deployment/test_windows_production_pre_enrollment.py
          tests/deployment/test_windows_stage9_production_trust_provenance.py
          tests/deployment/test_production_enrollment_issuer.py
          tests/deployment/test_production_pdsa_signing.py
          tests/architecture/test_stage9_external_provisioning_architecture.py
          tests/architecture/test_stage9_pdsa_enrollment_challenge_contract.py
          tests/architecture/test_stage9_production_tpm_custody_contract.py
          tests/architecture/test_stage9_pdsa_enrollment_authorization_contract.py
          tests/architecture/test_stage9_lppi_authority_key_binding_contract.py
          tests/architecture/test_stage9_lppi_authenticated_operation_binding_contract.py
          tests/architecture/test_stage9_cha_logical_operation_contract.py
          tests/architecture/test_stage9_account_initial_binding_contract.py
          -m "not hardware and not destructive and not network"
          --cov=bot_core.risk.portfolio
          --cov=bot_core.licensing.canonical
          --cov=bot_core.security.license
          --cov=deployment.windows_tpm_substrate_probe
          --cov=bot_core.licensing.pre_enrollment
          --cov=bot_core.licensing.pdsa_enrollment_challenge
          --cov=bot_core.licensing.production_tpm_custody
          --cov=bot_core.licensing.production_pre_enrollment
          --cov=bot_core.licensing.pdsa_enrollment_authorization
          --cov=bot_core.licensing.external_provisioning
          --cov=bot_core.licensing.lppi_package_acceptance
          --cov=bot_core.licensing.lppi_authority_key
          --cov=bot_core.licensing.lppi_authority_custody
          --cov=bot_core.licensing.lppi_authenticated_operation
          --cov=bot_core.licensing.cha_logical_operation
          --cov=bot_core.licensing.cha_account_reservation
          --cov=bot_core.uuid7
          --cov=deployment.windows_cng_pre_enrollment
          --cov=deployment.windows_cng_custody_bridge
          --cov=deployment.windows_lppi_authority_key
          --cov=deployment.windows_lppi_authority_custody
          --cov=deployment.windows_production_lppi_authority
          --cov=deployment.windows_production_lppi_operation
          --cov=deployment.windows_production_cha_operation
          --cov=deployment.windows_production_cha_account_reservation
          --cov=deployment.windows_production_pre_enrollment
          --cov=deployment.windows_stage9_production_trust
          --cov=deployment.production_enrollment_issuer
          --cov=deployment.production_pdsa_signing
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          -q
      - name: Account INITIAL_BINDING security and durability (serial)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DUDZIAN_TEST_MODE: "1"
          DUDZIAN_ALLOW_LONG_POLL: "0"
        run: >-
          python -m pytest -p asyncio -p pytest_cov
          tests/licensing/test_cha_account_reservation.py
          tests/licensing/test_cha_account_reservation_durability.py
          -m "not hardware and not destructive and not network"
          --cov=bot_core.licensing.cha_account_reservation
          --cov=deployment.windows_production_cha_account_reservation
          --cov-append --cov-config=.coveragerc
          --cov-report=term-missing --cov-report=xml:coverage.xml -q
      - name: Canonical JCS profile vectors (serial)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DUDZIAN_TEST_MODE: "1"
          DUDZIAN_ALLOW_LONG_POLL: "0"
        run: >-
          python -m pytest -p asyncio -p pytest_cov
          tests/licensing/test_cha_canonical_jcs.py
          --cov=deployment.canonical_json
          --cov-append --cov-config=.coveragerc
          --cov-report=term-missing --cov-report=xml:coverage.xml -q
      - name: Root-proof attempt reservation security and durability (serial)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DUDZIAN_TEST_MODE: "1"
          DUDZIAN_ALLOW_LONG_POLL: "0"
        run: >-
          python -m pytest -p asyncio -p pytest_cov
          tests/architecture/test_cha_root_proof_attempt_reservation_contract.py
          tests/licensing/test_cha_root_proof_attempt_reservation.py
          tests/licensing/test_cha_attempt_store_stage9.py
          tests/security/test_cha_attempt_store_production_local.py
          -m "not hardware and not destructive and not network"
          --cov=bot_core.licensing.cha_root_proof_attempt_reservation
          --cov=bot_core.cha_attempt_store
          --cov-append --cov-config=.coveragerc
          --cov-report=term-missing --cov-report=xml:coverage.xml -q
      - name: Signed immutable issuance attempt security and durability (serial)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DUDZIAN_TEST_MODE: "1"
          DUDZIAN_ALLOW_LONG_POLL: "0"
        run: >-
          python -m pytest -p asyncio -p pytest_cov
          tests/licensing/test_cha_root_proof_signed_attempt.py
          tests/security/test_native_custody_locking.py
          tests/architecture/test_stage9_root_proof_signed_immutable_attempt_contract.py
          -m "not hardware and not destructive and not network"
          --cov=bot_core.local_signing_custody
          --cov=bot_core.cha_issuance_request
          --cov=bot_core.cha_attempt_signatures
          --cov=bot_core.cha_root_proof_signing_custody
          --cov=bot_core.licensing.cha_root_proof_signed_attempt
          --cov=bot_core.cha_attempt_store
          --cov-append --cov-config=.coveragerc
          --cov-report=term-missing --cov-report=xml:coverage.xml -q
      - name: Pre-account credential authorities and provider composition (serial)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          DUDZIAN_TEST_MODE: "1"
          DUDZIAN_ALLOW_LONG_POLL: "0"
          DUDZIAN_TEST_POSTGRES_DSN: "host=127.0.0.1 port=55432 dbname=postgres user=postgres"
        run: >-
          python -m pytest -p asyncio -p pytest_cov
          tests/architecture/test_stage9_root_proof_preaccount_credentials_contract.py
          tests/security/test_postgresql_preaccount_credential_contract.py
          tests/security/test_postgresql_preaccount_credentials_integration.py
          tests/security/test_postgresql_root_proof_issuance_authority.py
          tests/security/test_cha_signed_attempt_postgresql.py
          tests/security/test_postgresql_entitlement_registry.py
          tests/security/test_root_proof_issuer_substrate.py
          tests/security/test_local_signing_custody.py
          tests/architecture/test_m05_account_genesis_independent_root_proof_issuer_contract.py
          tests/architecture/test_m05_account_genesis_root_proof_issuer_implementation_readiness_contract.py
          tests/architecture/test_m05_account_genesis_root_proof_issuer_production_substrate_selection_contract.py
          -m "not hardware and not destructive and not network"
          --cov=bot_core.cha_root_proof_signing_custody
          --cov=bot_core.licensing.cha_root_proof_signed_attempt
          --cov=bot_core.postgresql_preaccount_credentials
          --cov=bot_core.postgresql_root_proof_issuance_authority
          --cov=bot_core.postgresql_entitlement_registry
          --cov=bot_core.root_proof_issuer_substrate
          --cov=bot_core.licensing.cha_root_proof_attempt_reservation
          --cov-append --cov-config=.coveragerc
          --cov-report=term-missing --cov-report=xml:coverage.xml -q
      - name: Changed-code coverage ratchet
        if: github.event_name == 'pull_request'
        run: diff-cover coverage.xml --compare-branch "origin/${{ github.base_ref }}" --fail-under=70
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-ratchet-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  security-static:
    name: Semgrep and working-tree secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Semgrep CE
        run: python -m pip install "semgrep==1.179.0"
      - name: Semgrep maintained community baseline (advisory)
        continue-on-error: true
        run: >-
          semgrep scan
          --config p/python
          --config p/security-audit
          --metrics=off
          --disable-version-check
          --json
          --output "$RUNNER_TEMP/semgrep-community.json"
          --exclude tests
          --exclude archive
          --exclude ccxt
          bot_core core deployment scripts
      - name: Semgrep CryptoHunter blocking rules
        run: >-
          semgrep scan
          --config .semgrep/cryptohunter.yml
          --metrics=off
          --disable-version-check
          --error
          bot_core core deployment scripts
      - name: Semgrep CryptoHunter rule fixtures
        run: >-
          semgrep scan --test
          --config .semgrep/cryptohunter.yml .semgrep/cryptohunter.py
          --metrics=off --disable-version-check --jobs 1
      - name: Install verified Betterleaks stable
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/betterleaks"
          mkdir -p "$install_dir"
          asset="$install_dir/betterleaks_1.9.0_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$asset" \
            https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz
          printf '%s  %s\n' "$BETTERLEAKS_1_9_0_LINUX_X64_SHA256" "$asset" \
            | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "$install_dir/checksums.txt" \
            https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/checksums.txt
          grep 'betterleaks_1.9.0_linux_x64.tar.gz$' "$install_dir/checksums.txt" \
            > "$install_dir/expected.sha256"
          (cd "$install_dir" && sha256sum --check expected.sha256)
          tar -xzf "$asset" -C "$install_dir" betterleaks
          chmod +x "$install_dir/betterleaks"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/betterleaks" version
      - name: Betterleaks working tree (offline, blocking)
        run: >-
          betterleaks dir
          --baseline-path .betterleaks-baseline.json
          --redact=100
          --no-banner
          --no-color
          --report-format json
          --report-path "$RUNNER_TEMP/betterleaks-working-tree.json"
          .
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-security-reports
          path: |
            ${{ runner.temp }}/semgrep-community.json
            ${{ runner.temp }}/betterleaks-working-tree.json
          if-no-files-found: warn
          retention-days: 7

  history-secrets:
    name: Full Git history secrets (advisory baseline)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install verified Betterleaks stable
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/betterleaks"
          mkdir -p "$install_dir"
          asset="$install_dir/betterleaks_1.9.0_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$asset" \
            https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz
          printf '%s  %s\n' "$BETTERLEAKS_1_9_0_LINUX_X64_SHA256" "$asset" \
            | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            --output "$install_dir/checksums.txt" \
            https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/checksums.txt
          grep 'betterleaks_1.9.0_linux_x64.tar.gz$' "$install_dir/checksums.txt" \
            > "$install_dir/expected.sha256"
          (cd "$install_dir" && sha256sum --check expected.sha256)
          tar -xzf "$asset" -C "$install_dir" betterleaks
          chmod +x "$install_dir/betterleaks"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan complete history without credential validation
        run: >-
          betterleaks git
          --redact=100
          --no-banner
          --no-color
          --report-format json
          --report-path "$RUNNER_TEMP/betterleaks-history.json"
          --log-opts=--all
          .
      - name: Upload redacted history report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: betterleaks-history
          path: ${{ runner.temp }}/betterleaks-history.json
          if-no-files-found: warn
          retention-days: 7
