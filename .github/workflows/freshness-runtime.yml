name: Freshness Python runtime

on:
  pull_request:
    paths:
      - '.github/workflows/freshness-runtime.yml'
      - 'deployment/*freshness*'
      - 'deployment/requirements-freshness-runtime.lock'
      - 'deployment/production_local_installer*.py'
      - 'deployment/stage9_vm_trial.py'
      - 'deployment/stage9_vm_environment.py'
      - 'deployment/stage9_vm_native.py'
      - 'scripts/prepare_stage9_vm_bundle.py'
      - 'scripts/prepare_stage9_protected_tree.py'
      - 'scripts/stage9_runtime_provenance.py'
      - 'deployment/install-production-local.sh'
      - 'deployment/systemd/cryptohunter-freshness-verifier.service'
      - 'bot_core/freshness_service_identity.py'
      - 'bot_core/freshness_deployment_qualification.py'
      - 'tests/deployment/test_freshness_runtime*'
      - 'tests/deployment/test_freshness_application.py'
      - 'tests/security/test_freshness_qualification_profiles.py'
      - 'tests/deployment/test_build_freshness_runtime.py'
      - 'tests/deployment/test_stage9_vm_trial.py'
      - 'tests/deployment/test_stage9_harness_import_security.py'
      - 'tests/deployment/test_stage9_harness_runtime_guard.py'
      - 'tests/deployment/test_stage9_protected_tree.py'
      - 'tests/deployment/test_stage9_runtime_provenance.py'
      - 'tests/deployment/test_stage9_vm_environment.py'
      - 'tests/deployment/test_stage9_vm_native.py'
      - 'tests/deployment/test_prepare_stage9_vm_bundle.py'
      - 'docs/runbooks/STAGE9_*VM_TRIAL.md'
      - 'docs/runbooks/STAGE9_LINUX_VM_HARNESS.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/freshness-runtime.yml'
      - 'deployment/*freshness*'
      - 'deployment/requirements-freshness-runtime.lock'
      - 'deployment/production_local_installer*.py'
      - 'deployment/stage9_vm_trial.py'
      - 'deployment/stage9_vm_environment.py'
      - 'deployment/stage9_vm_native.py'
      - 'scripts/prepare_stage9_vm_bundle.py'
      - 'scripts/prepare_stage9_protected_tree.py'
      - 'scripts/stage9_runtime_provenance.py'
      - 'deployment/install-production-local.sh'
      - 'deployment/systemd/cryptohunter-freshness-verifier.service'
      - 'bot_core/freshness_service_identity.py'
      - 'bot_core/freshness_deployment_qualification.py'
      - 'tests/deployment/test_freshness_runtime*'
      - 'tests/deployment/test_freshness_application.py'
      - 'tests/security/test_freshness_qualification_profiles.py'
      - 'tests/deployment/test_build_freshness_runtime.py'
      - 'tests/deployment/test_stage9_vm_trial.py'
      - 'tests/deployment/test_stage9_harness_import_security.py'
      - 'tests/deployment/test_stage9_harness_runtime_guard.py'
      - 'tests/deployment/test_stage9_protected_tree.py'
      - 'tests/deployment/test_stage9_runtime_provenance.py'
      - 'tests/deployment/test_stage9_vm_environment.py'
      - 'tests/deployment/test_stage9_vm_native.py'
      - 'tests/deployment/test_prepare_stage9_vm_bundle.py'
      - 'docs/runbooks/STAGE9_*VM_TRIAL.md'
      - 'docs/runbooks/STAGE9_LINUX_VM_HARNESS.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  noble-offline-runtime:
    name: Ubuntu 24.04 CPython 3.12 offline runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pobierz wyłącznie zamknięty katalog wheelów i sprawdź SHA-256
        run: >-
          /usr/bin/python3.12 -I -s -B deployment/build_freshness_runtime.py
          --download-wheelhouse "$RUNNER_TEMP/freshness-wheelhouse"
      - name: Przygotuj izolowane narzędzia testów
        run: |
          python -m venv "$RUNNER_TEMP/freshness-test-tools"
          "$RUNNER_TEMP/freshness-test-tools/bin/python" -m pip install pytest
          "$RUNNER_TEMP/freshness-test-tools/bin/python" -m pip install \
            --no-index --require-hashes --only-binary=:all: \
            --find-links "$RUNNER_TEMP/freshness-wheelhouse" \
            -r deployment/requirements-freshness-runtime.lock
      - name: Sprawdź odtwarzalność dwóch buildów offline i odmowy bez roota
        env:
          FRESHNESS_RUNTIME_WHEELHOUSE: ${{ runner.temp }}/freshness-wheelhouse
          FRESHNESS_RUNTIME_BASE_PYTHON: /usr/bin/python3.12
          FRESHNESS_RUNTIME_REQUIRE_NATIVE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        # Oba warianty używają rzeczywistego buildera: venv, pip z --no-index,
        # --require-hashes, --only-binary=:all: oraz sondy importów/Ed25519/libpq.
        # Każda próba ma własne tmp_path; brak wejść CI jest błędem, nie skipem.
        # Odtwarzalność porównuje wszystkie obiekty obu buildów na tej samej bazie
        # systemowej przy różnych długościach staging, z zachowaniem RECORD.
        run: >-
          "$RUNNER_TEMP/freshness-test-tools/bin/python" -m pytest
          --confcutdir=tests/deployment -v -ra
          tests/deployment/test_freshness_runtime.py
          tests/deployment/test_freshness_runtime_record.py
          tests/deployment/test_freshness_runtime_bytecode.py
          tests/deployment/test_freshness_application.py
          tests/deployment/test_build_freshness_runtime.py
          --junitxml="$RUNNER_TEMP/freshness-runtime-tests.xml"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: freshness-runtime-ubuntu2404-tests
          path: ${{ runner.temp }}/freshness-runtime-tests.xml
          if-no-files-found: error
          retention-days: 14
