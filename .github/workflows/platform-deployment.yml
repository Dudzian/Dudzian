          tests/deployment/test_linux_physical_native.py
          tests/scripts/test_linux_physical_evidence_workflow.py
      - name: Sprawdź typy modułów ścieżki dowodowej
        run: >-
          python -m mypy deployment/linux_physical_evidence.py
          deployment/linux_physical_observations.py deployment/linux_physical_native.py
          deployment/linux_release_identity.py
          deployment/production_local_installer.py
          deployment/freshness_application.py
