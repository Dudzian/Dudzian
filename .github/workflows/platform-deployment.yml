name: Platform deployment tracks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: "Separate non-signing Stage 9 checks; full keeps all existing gates"
        required: true
        type: choice
        options: [full, stage9-safe]
        default: full
      expected_commit:
        description: "Exact 40-hex reviewed HEAD required for stage9-safe"
        required: false
        type: string
        default: ""
      run_stage10:
        description: "Run destructive/reboot Stage-10 lifecycle qualification"
        required: true
        type: boolean
        default: false
      run_linux_physical:
        description: "Zweryfikuj podpisane dowody z zatwierdzonego fizycznego hosta Linux"
        required: true
        type: boolean
        default: false

jobs:
  stage9-safe-validation:
    name: Stage 9 safe checks (Python ${{ matrix.python }})
    if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'stage9-safe'
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      STAGE9_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      STAGE9_RUN_STAGE10: ${{ toJSON(inputs.run_stage10) }}
      STAGE9_RUN_PHYSICAL: ${{ toJSON(inputs.run_linux_physical) }}
      STAGE9_SAFE_OUTPUT: stage9-safe-${{ matrix.python }}
    steps:
      - name: Require exact commit and forbid privileged dispatch inputs
        shell: python
        run: |
          import os
          import re
          expected = os.environ["STAGE9_EXPECTED_COMMIT"]
          if (re.fullmatch(r"[0-9a-f]{40}", expected) is None
              or expected != os.environ["GITHUB_SHA"]
              or os.environ["STAGE9_RUN_STAGE10"] != "false"
              or os.environ["STAGE9_RUN_PHYSICAL"] != "false"):
              raise SystemExit("STAGE9_SAFE_DISPATCH_REFUSED")
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated validation tools without building runtime
        run: >-
          python -m pip install pytest PyYAML jsonschema "cryptography>=50.0.1,<51"
          "psycopg[binary]>=3.2,<4" "ruff==0.14.11" "mypy==1.10.0"
          "pre-commit>=4,<5" "coverage>=7.10,<8" "diff-cover>=9,<12"
          types-PyYAML types-requests "grpcio>=1.62,<2" "protobuf>=4.24,<6" packaging
      - name: Install syscall observation tool on disposable hosted runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes strace
      - name: Install pinned offline secret scanner
        shell: bash
        run: |
          set -euo pipefail
          s9_tools="$RUNNER_TEMP/stage9-safe-tools-${{ matrix.python }}"
          mkdir "$s9_tools"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz \
            -o "$s9_tools/betterleaks.tar.gz"
          printf '%s  %s\n' f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7 \
            "$s9_tools/betterleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$s9_tools/betterleaks.tar.gz" -C "$s9_tools" betterleaks
          printf 'BETTERLEAKS_BIN=%s/betterleaks\n' "$s9_tools" >> "$GITHUB_ENV"
      - name: Run explicit static, regression and adversarial checks
        run: >-
          python -B scripts/quality/run_stage9_safe_validation.py
          --expected-commit "$STAGE9_EXPECTED_COMMIT"
          --base-commit fc15b98298c5430286dd2206ec7eeb8f20e2497b
          --output "$RUNNER_TEMP/$STAGE9_SAFE_OUTPUT"
      - name: Preserve actual exits, logs, JUnit and coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stage9-safe-${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ env.STAGE9_SAFE_OUTPUT }}/*.json
            ${{ runner.temp }}/${{ env.STAGE9_SAFE_OUTPUT }}/*.log
            ${{ runner.temp }}/${{ env.STAGE9_SAFE_OUTPUT }}/*.error
            ${{ runner.temp }}/${{ env.STAGE9_SAFE_OUTPUT }}/*.xml
            ${{ runner.temp }}/${{ env.STAGE9_SAFE_OUTPUT }}/*.trace
            ${{ runner.temp }}/${{ env.STAGE9_SAFE_OUTPUT }}/.coverage
          if-no-files-found: error
          retention-days: 14

  linux-evidence-contract:
    if: (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe')
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - name: Install strace for bootstrap file-access regression
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes strace
      - run: >-
          python -m pip install pytest pyyaml "cryptography>=50.0.1,<51" jsonschema
          "psycopg[binary]>=3.2,<4" "ruff==0.14.11" "mypy==1.10.0" types-PyYAML types-requests
      - name: Sprawdź lint wszystkich modułów ścieżki dowodowej
