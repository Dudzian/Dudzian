      - name: Zapisz rzeczywistą tożsamość i uprawnienia katalogów testowych
        shell: python
        run: |
          import json
          import os
          import stat
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory(prefix="stage9-exporter-ci-") as directory:
              paths = (Path("/"), Path("/tmp"), Path(directory))
              print(json.dumps({
                  "effective_uid": os.geteuid(),
                  "effective_gid": os.getegid(),
                  "directories": [
                      {"path": str(path), "uid": path.lstat().st_uid,
                       "gid": path.lstat().st_gid,
                       "mode": oct(stat.S_IMODE(path.lstat().st_mode))}
                      for path in paths
                  ],
              }, sort_keys=True))
      - name: Sprawdź hermetyczne kontrakty i odmowy bez kwalifikacji fizycznej
