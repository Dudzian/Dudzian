name: Platform deployment tracks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_stage10:
        description: "Run destructive/reboot Stage-10 lifecycle qualification"
        required: true
        type: boolean
        default: false

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps: &core_steps
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[test]"
      - name: Execute complete canonical cross-platform core plan
        run: python -m deployment.core_test_plan --runner-os "${{ runner.os }}" --output "core-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: core-evidence-${{ runner.os }}
          path: core-${{ runner.os }}.json

  core-windows:
    runs-on: windows-latest
    steps: *core_steps

  core-macos:
    runs-on: macos-latest
    steps: *core_steps

  windows-deployment-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest -q tests/deployment/test_platform_readiness.py tests/deployment/test_platform_evidence.py
      - name: Prove Windows PowerShell captured native transport
        shell: powershell
        run: >-
          ./deployment/windows_captured_python_regression.ps1
          -PythonExecutable (Get-Command python).Source
      - name: Prove Windows PowerShell ownership JSON round-trip
        shell: powershell
        run: ./deployment/windows_ownership_json_regression.ps1

  windows-deployment-integration:
    runs-on: windows-latest
    needs: windows-deployment-contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[test]" pywin32
      - name: Prove Windows PowerShell parser and path qualification runtime
        shell: powershell
        run: |
          foreach ($script in @(
            "deployment/windows_scm_probe.ps1",
            "deployment/windows_path_qualification.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          . ./deployment/windows_path_qualification.ps1
          $accepted = @(
            'C:\Program Files\Python311\python.exe',
            'D:\a\Dudzian\Dudzian',
            '\\server\share\folder\file.exe'
          )
          $rejected = @(
            'relative\thing', '.\thing', '..\thing', 'C:relative',
            '\rooted-but-drive-relative', '', '   '
          )
          foreach ($path in $accepted) {
            if (-not (Test-FullyQualifiedWindowsPath $path)) { throw "rejected: [$path]" }
          }
          foreach ($path in $rejected) {
            if (Test-FullyQualifiedWindowsPath $path) { throw "accepted: [$path]" }
          }
      - name: Prove native Windows PowerShell ACL runtime inherited from pwsh
        shell: pwsh
        run: |
          $env:WINDOWS_ACL_REGRESSION_PARENT_EDITION = $PSVersionTable.PSEdition
          python -m deployment.windows_native_acl_regression
      - name: Execute canonical reviewed Windows acceptance
        timeout-minutes: 30
        run: >-
          python -m deployment.windows_acceptance --mode github
          --core-output windows-acceptance-core.json
          --evidence-output windows-scm-evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: windows-scm-evidence
          path: windows-scm-evidence.json

  windows-clean-install-integration:
    runs-on: windows-latest
    needs: [windows-deployment-contract, windows-deployment-integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11.9", architecture: "x64"}
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: "10.0.x"}
      - name: Install exact WiX production compiler
        shell: pwsh
        run: dotnet tool install --global wix --version 7.0.0
      - name: Install production build dependencies
        shell: pwsh
        run: |
          python scripts/ci/bootstrap_locked_pip.py deploy/packaging/requirements-desktop.lock
          python -m pip install --no-deps -r deploy/packaging/requirements-desktop.lock
          python -m pip install --no-deps -r deploy/packaging/requirements-windows-runtime.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Require operator-published public Production Trust package
        shell: pwsh
        env:
          PRODUCTION_TRUST_ARTIFACT_RUN_ID: ${{ vars.STAGE9_PRODUCTION_TRUST_ARTIFACT_RUN_ID }}
        run: |
          if ($env:PRODUCTION_TRUST_ARTIFACT_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw "STAGE9_PRODUCTION_TRUST_ARTIFACT_RUN_ID is required; MSI promotion is blocked"
          }
      - name: Fetch operator-published public Production Trust package
        uses: actions/download-artifact@v8
        with:
          name: stage9-public-production-trust
          # The operator archive must contain the 12 JSON files directly at its
          # root. download-artifact materializes that root as this canonical ID.
          path: ${{ runner.temp }}/390299aaa1ea928a6c2bfdd81a4c50cfde82a7744cd054e8628d5937b90f1699
          run-id: ${{ vars.STAGE9_PRODUCTION_TRUST_ARTIFACT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and run canonical Stage-9 proof
        timeout-minutes: 30
        run: >-
          python -m deployment.windows_stage9_clean_install
          --version 0.1.0 --receipt dist/windows/windows-clean-install-receipt.json
          --production-trust-package "${{ runner.temp }}/390299aaa1ea928a6c2bfdd81a4c50cfde82a7744cd054e8628d5937b90f1699"
          --production-trust-artifact-run-id "${{ vars.STAGE9_PRODUCTION_TRUST_ARTIFACT_RUN_ID }}"
      - name: Produce revision-bound Stage-9 evidence
        run: >-
          python -m deployment.platform_evidence windows-clean-install
          --receipt dist/windows/windows-clean-install-receipt.json
          --msi dist/windows/CryptoHunter-0.1.0-windows-x64.msi
          --manifest dist/windows/installer-manifest.json
          --production-trust-package "${{ runner.temp }}/390299aaa1ea928a6c2bfdd81a4c50cfde82a7744cd054e8628d5937b90f1699"
          --output dist/windows/windows-clean-install-evidence.json
      - name: Preserve Stage-9 MSI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-clean-install-diagnostics
          if-no-files-found: ignore
          path: |
            dist/windows/windows-clean-install-receipt.json
            dist/windows/windows-clean-install-evidence.json
            dist/windows/installer-manifest.json
            dist/windows/logs/*.log
            dist/windows/logs/*.json
      - uses: actions/upload-artifact@v7
        with:
          name: windows-clean-install-evidence
          path: |
            dist/windows/installer-manifest.json
            dist/windows/windows-clean-install-receipt.json
            dist/windows/windows-clean-install-evidence.json
            dist/windows/logs/*.log
      - name: Promote exactly the qualified Stage-9 MSI
        uses: actions/upload-artifact@v7
        with:
          name: windows-stage9-qualified-msi
          if-no-files-found: error
          path: |
            dist/windows/CryptoHunter-0.1.0-windows-x64.msi
            dist/windows/installer-manifest.json
            dist/windows/windows-clean-install-receipt.json
            dist/windows/windows-clean-install-evidence.json

  windows-stage10-prepare-and-schedule-reboot:
    if: github.event_name == 'workflow_dispatch' && inputs.run_stage10 == true
    runs-on: [self-hosted, Windows, X64, cryptohunter-stage10]
    needs: [windows-deployment-integration, windows-clean-install-integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", architecture: "x64"}
      - uses: actions/download-artifact@v8
        with:
          name: windows-clean-install-evidence
          path: stage10-qualified
      - name: Capture same-host continuity state
        shell: pwsh
        run: >-
          ./deployment/windows_stage10_live.ps1 -Mode prepare-reboot
          -State stage10-continuity.json
          -QualifiedManifest stage10-qualified/installer-manifest.json
          -CleanInstallReceipt stage10-qualified/windows-clean-install-receipt.json
      - uses: actions/upload-artifact@v7
        with:
          name: stage10-continuity
          path: stage10-continuity.json
      - name: Schedule reboot after runner post-job cleanup
        shell: pwsh
        run: shutdown.exe /r /t 75 /d p:4:1 /c "CryptoHunter Stage-10 qualification"

  windows-stage10-reboot-barrier:
    if: github.event_name == 'workflow_dispatch' && inputs.run_stage10 == true
    needs: windows-stage10-prepare-and-schedule-reboot
    runs-on: ubuntu-latest
    steps:
      - name: Keep the rebooting host unavailable to the next job
        run: sleep 240

  windows-stage10-qualify-after-reboot:
    if: github.event_name == 'workflow_dispatch' && inputs.run_stage10 == true
    needs: windows-stage10-reboot-barrier
    runs-on: [self-hosted, Windows, X64, cryptohunter-stage10]
    timeout-minutes: 1800
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", architecture: "x64"}
      - uses: actions/download-artifact@v8
        with: {name: stage10-continuity, path: stage10}
      - name: Qualify reboot and the 24-hour lifecycle
        shell: pwsh
        run: |
          Start-Transcript -Path stage10/windows-stage10-transcript.log
          try {
            ./deployment/windows_stage10_live.ps1 -Mode qualify `
              -State stage10/stage10-continuity.json `
              -Output stage10/windows-stage10-receipt.json
          } finally {
            Stop-Transcript
          }
      - name: Produce same-run revision/runner/machine-bound LIVE evidence
        run: >-
          python -m deployment.platform_evidence windows-stage10
          --receipt stage10/windows-stage10-receipt.json
          --output stage10/windows-stage10-evidence.json
      - name: Preserve Stage-10 lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-stage10-lifecycle-evidence
          if-no-files-found: ignore
          path: |
            stage10/stage10-continuity.json
            stage10/windows-stage10-receipt.json
            stage10/windows-stage10-evidence.json
            stage10/windows-stage10-transcript.log

  linux-deployment-integration:
    if: github.event_name == 'pull_request' || inputs.run_stage10 == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - name: Enforce recorded Linux integration evidence
        run: python -m deployment.platform_readiness --platform LINUX

  macos-deployment-integration:
    if: github.event_name == 'pull_request' || inputs.run_stage10 == true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - name: Enforce recorded macOS integration evidence
        run: python -m deployment.platform_readiness --platform MACOS

  windows-release-gate:
    if: always() && (github.event_name == 'pull_request' || inputs.run_stage10 == true)
    runs-on: windows-latest
    needs:
      - core-linux
      - core-windows
      - core-macos
      - windows-deployment-contract
      - windows-deployment-integration
      - windows-clean-install-integration
      - windows-stage10-prepare-and-schedule-reboot
      - windows-stage10-reboot-barrier
      - windows-stage10-qualify-after-reboot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v8
        with:
          pattern: core-evidence-*
          path: evidence
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: windows-clean-install-evidence
          path: evidence
      - uses: actions/download-artifact@v8
        with:
          name: windows-scm-evidence
          path: evidence
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_dispatch' && inputs.run_stage10 == true
        with:
          name: windows-stage10-lifecycle-evidence
          path: evidence
      - name: Aggregate revision-bound cross-OS core evidence
        run: >-
          python -m deployment.platform_evidence aggregate-core
          --marker evidence/core-Linux.json
          --marker evidence/core-Windows.json
          --marker evidence/core-macOS.json
          --output evidence/core-matrix.json
      - name: Enforce canonical Windows production readiness
        if: github.event_name != 'workflow_dispatch'
        run: >-
          python -m deployment.platform_readiness --platform WINDOWS
          --evidence evidence/core-matrix.json
          --evidence evidence/windows-scm-evidence.json
          --evidence evidence/windows-clean-install-evidence.json
      - name: Enforce canonical Windows production readiness with Stage-10 lifecycle
        if: github.event_name == 'workflow_dispatch' && inputs.run_stage10 == true
        run: >-
          python -m deployment.platform_readiness --platform WINDOWS
          --evidence evidence/core-matrix.json
          --evidence evidence/windows-scm-evidence.json
          --evidence evidence/windows-clean-install-evidence.json
          --evidence evidence/windows-stage10-evidence.json
