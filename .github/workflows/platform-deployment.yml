      - name: Sprawdź format wszystkich modułów ścieżki dowodowej
        run: >-
          python -m ruff format --check deployment/linux_physical_evidence.py
          deployment/linux_physical_observations.py deployment/linux_physical_native.py
          deployment/linux_release_identity.py
          deployment/production_local_installer.py
