          tests/scripts/test_platform_core_evidence_workflow.py

  linux-physical-challenge:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe') && (github.event_name == 'workflow_dispatch' && inputs.run_linux_physical == true && github.ref == 'refs/heads/main' && github.repository == 'Dudzian/Dudzian')
    runs-on: ubuntu-24.04
    environment: stage9-linux-challenge
    permissions: {contents: read, actions: read}
    timeout-minutes: 10
    env:
      LINUX_POLICY_COMMIT: ${{ vars.STAGE9_LINUX_EVIDENCE_POLICY_COMMIT }}
      LINUX_POLICY_SHA256: ${{ vars.STAGE9_LINUX_EVIDENCE_POLICY_SHA256 }}
      LINUX_HOST_ID: ${{ vars.STAGE9_LINUX_EVIDENCE_HOST_ID }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: python -m pip install cryptography
      - name: Wymagaj rzeczywistej ochrony środowiska wydającego challenge
        env: {GH_TOKEN: "${{ secrets.STAGE9_GITHUB_CONTROLS_READ_TOKEN }}"}
        run: >-
          python -m deployment.linux_evidence_handoff require-environment
          --repository "$GITHUB_REPOSITORY" --name stage9-linux-challenge
          --policy-commit "$LINUX_POLICY_COMMIT"
      - name: Pobierz dane polityki z dokładnej zatwierdzonej rewizji
        uses: actions/checkout@v7
        with:
          ref: "${{ vars.STAGE9_LINUX_EVIDENCE_POLICY_COMMIT }}"
          path: stage9-approved-policy
          persist-credentials: false
      - name: Wydaj jednorazowe challenge bieżącej rewizji i próby CI
        run: >-
          python -m deployment.linux_physical_evidence issue-challenge
          --source-revision "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID"
          --ci-run-attempt "$GITHUB_RUN_ATTEMPT" --host-id "$LINUX_HOST_ID"
          --policy stage9-approved-policy/policy.json --expected-policy-sha256 "$LINUX_POLICY_SHA256"
          --output linux-challenge.json
      - uses: actions/upload-artifact@v7
        with:
          name: stage9-linux-challenge-${{ github.run_id }}-${{ github.run_attempt }}
          path: linux-challenge.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  linux-physical-validation:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe') && (github.event_name == 'workflow_dispatch' && inputs.run_linux_physical == true && github.ref == 'refs/heads/main' && github.repository == 'Dudzian/Dudzian')
    needs: [linux-physical-challenge]
    runs-on: ubuntu-24.04
    # Operator zatwierdza ten job dopiero po zakończeniu transportu z Della.
    environment: stage9-linux-evidence
    permissions: {contents: read, actions: read}
    timeout-minutes: 15
    env:
      LINUX_POLICY_COMMIT: ${{ vars.STAGE9_LINUX_EVIDENCE_POLICY_COMMIT }}
      LINUX_POLICY_SHA256: ${{ vars.STAGE9_LINUX_EVIDENCE_POLICY_SHA256 }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: python -m pip install cryptography
      - name: Wymagaj niezależnej aprobaty i ochrony środowiska
        env: {GH_TOKEN: "${{ secrets.STAGE9_GITHUB_CONTROLS_READ_TOKEN }}"}
        run: >-
          python -m deployment.linux_evidence_handoff require-environment
          --repository "$GITHUB_REPOSITORY" --name stage9-linux-evidence
          --policy-commit "$LINUX_POLICY_COMMIT"
      - name: Pobierz dane polityki z dokładnej zatwierdzonej rewizji
        uses: actions/checkout@v7
        with:
          ref: "${{ vars.STAGE9_LINUX_EVIDENCE_POLICY_COMMIT }}"
          path: stage9-approved-policy
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: stage9-linux-challenge-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Pobierz jeden ograniczony pakiet z zatwierdzonego transportu
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: >-
          python -m deployment.linux_evidence_handoff fetch
          --repository "$GITHUB_REPOSITORY" --target-run-id "$GITHUB_RUN_ID"
          --target-run-attempt "$GITHUB_RUN_ATTEMPT" --output evidence/bundle.json
      - name: Zweryfikuj podpisy, pochodzenie i semantykę surowych obserwacji
        run: >-
          python -m deployment.linux_physical_evidence verify
          --bundle evidence/bundle.json --challenge evidence/linux-challenge.json
          --policy stage9-approved-policy/policy.json --expected-policy-sha256 "$LINUX_POLICY_SHA256"
          --source-revision "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID"
          --ci-run-attempt "$GITHUB_RUN_ATTEMPT" --output evidence/linux-evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: stage9-linux-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/bundle.json
            evidence/linux-challenge.json
            evidence/linux-evidence.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  linux-production-gate:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe') && (github.event_name == 'workflow_dispatch' && inputs.run_linux_physical == true && github.ref == 'refs/heads/main' && github.repository == 'Dudzian/Dudzian')
    needs: [linux-physical-validation, core-linux, core-windows, core-macos]
    runs-on: ubuntu-24.04
    environment: stage9-linux-evidence
    permissions: {contents: read, actions: read}
    timeout-minutes: 15
    env:
      LINUX_POLICY_COMMIT: ${{ vars.STAGE9_LINUX_EVIDENCE_POLICY_COMMIT }}
      LINUX_POLICY_SHA256: ${{ vars.STAGE9_LINUX_EVIDENCE_POLICY_SHA256 }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: python -m pip install cryptography
      - name: Wymagaj ochrony środowiska końcowej decyzji
        env: {GH_TOKEN: "${{ secrets.STAGE9_GITHUB_CONTROLS_READ_TOKEN }}"}
        run: >-
          python -m deployment.linux_evidence_handoff require-environment
          --repository "$GITHUB_REPOSITORY" --name stage9-linux-evidence
          --policy-commit "$LINUX_POLICY_COMMIT"
      - name: Pobierz dane polityki z dokładnej zatwierdzonej rewizji
        uses: actions/checkout@v7
        with:
          ref: "${{ vars.STAGE9_LINUX_EVIDENCE_POLICY_COMMIT }}"
          path: stage9-approved-policy
          persist-credentials: false
      - name: Wymagaj sukcesu wszystkich bieżących zadań Core
        shell: python
        env:
          CORE_LINUX_RESULT: ${{ needs.core-linux.result }}
          CORE_WINDOWS_RESULT: ${{ needs.core-windows.result }}
          CORE_MACOS_RESULT: ${{ needs.core-macos.result }}
        run: |
          import os
          names = ("CORE_LINUX_RESULT", "CORE_WINDOWS_RESULT", "CORE_MACOS_RESULT")
          if any(os.environ.get(name) != "success" for name in names):
              raise SystemExit("Wszystkie bieżące zadania Core muszą zakończyć się sukcesem")
      - uses: actions/download-artifact@v8
        with:
          name: stage9-linux-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - uses: actions/download-artifact@v8
        with: {name: core-evidence-Linux, path: evidence/core-Linux}
      - uses: actions/download-artifact@v8
        with: {name: core-evidence-Windows, path: evidence/core-Windows}
      - uses: actions/download-artifact@v8
        with: {name: core-evidence-macOS, path: evidence/core-macOS}
      - name: Połącz pełną macierz Core bieżącego przebiegu
        run: >-
          python -m deployment.platform_evidence aggregate-core
          --source-revision "$GITHUB_SHA"
          --marker evidence/core-Linux/core-Linux.json
          --marker evidence/core-Windows/core-Windows.json
          --marker evidence/core-macOS/core-macOS.json
          --output evidence/core-matrix.json
      - name: Podejmij decyzję po ponownej weryfikacji surowych dowodów
        run: >-
          python -m deployment.platform_readiness --platform LINUX
          --current-revision "$GITHUB_SHA" --expected-ci-provider "$GITHUB_SERVER_URL"
          --expected-ci-run-id "$GITHUB_RUN_ID" --expected-ci-run-attempt "$GITHUB_RUN_ATTEMPT"
          --evidence evidence/core-matrix.json --evidence evidence/linux-evidence.json
          --linux-bundle evidence/bundle.json --linux-challenge evidence/linux-challenge.json
          --linux-policy stage9-approved-policy/policy.json --linux-policy-sha256 "$LINUX_POLICY_SHA256"
          --linux-replay-ledger "$RUNNER_TEMP/linux-evidence-consumed.sqlite"

  core-linux:
    if: (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe')
    runs-on: ubuntu-latest
    steps: &core_steps
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[test]"
      - name: Execute complete canonical cross-platform core plan
        run: python -m deployment.core_test_plan --runner-os "${{ runner.os }}" --output "core-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: core-evidence-${{ runner.os }}
          path: core-${{ runner.os }}.json

  core-windows:
    if: (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe')
    runs-on: windows-latest
    steps: *core_steps

  core-macos:
    if: (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe')
    runs-on: macos-latest
    steps: *core_steps

  windows-deployment-contract:
    if: (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: python -m pip install pytest pyyaml
      - run: >-
          python -m pytest -q tests/deployment/test_platform_readiness.py
          tests/deployment/test_platform_evidence.py
          tests/deployment/test_windows_stage10_evidence_identity.py
          tests/scripts/test_platform_core_evidence_workflow.py
      - name: Prove Stage-10 soak identity refusal without running qualification
        shell: powershell
        run: ./deployment/windows_stage10_soak_identity_regression.ps1
      - name: Prove Windows PowerShell captured native transport
        shell: powershell
        run: >-
          ./deployment/windows_captured_python_regression.ps1
          -PythonExecutable (Get-Command python).Source
      - name: Prove Windows PowerShell ownership JSON round-trip
        shell: powershell
        run: ./deployment/windows_ownership_json_regression.ps1

  windows-deployment-integration:
    if: (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe')
    runs-on: windows-latest
    needs: windows-deployment-contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[test]" pywin32
      - name: Prove Windows PowerShell parser and path qualification runtime
        shell: powershell
        run: |
          foreach ($script in @(
            "deployment/windows_scm_probe.ps1",
            "deployment/windows_path_qualification.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          . ./deployment/windows_path_qualification.ps1
          $accepted = @(
            'C:\Program Files\Python311\python.exe',
            'D:\a\Dudzian\Dudzian',
            '\\server\share\folder\file.exe'
          )
          $rejected = @(
            'relative\thing', '.\thing', '..\thing', 'C:relative',
            '\rooted-but-drive-relative', '', '   '
          )
          foreach ($path in $accepted) {
            if (-not (Test-FullyQualifiedWindowsPath $path)) { throw "rejected: [$path]" }
          }
          foreach ($path in $rejected) {
            if (Test-FullyQualifiedWindowsPath $path) { throw "accepted: [$path]" }
          }
      - name: Prove native Windows PowerShell ACL runtime inherited from pwsh
        shell: pwsh
        run: |
          $env:WINDOWS_ACL_REGRESSION_PARENT_EDITION = $PSVersionTable.PSEdition
          python -m deployment.windows_native_acl_regression
      - name: Execute canonical reviewed Windows acceptance
        timeout-minutes: 30
        run: >-
          python -m deployment.windows_acceptance --mode github
          --core-output windows-acceptance-core.json
          --evidence-output windows-scm-evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: windows-scm-evidence
          path: windows-scm-evidence.json

  windows-clean-install-integration:
    if: (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe')
    runs-on: windows-latest
    needs: [windows-deployment-contract, windows-deployment-integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11.9", architecture: "x64"}
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: "10.0.x"}
      - name: Install exact WiX production compiler
        shell: pwsh
        run: dotnet tool install --global wix --version 7.0.0
      - name: Install production build dependencies
        shell: pwsh
        run: |
          python scripts/ci/bootstrap_locked_pip.py deploy/packaging/requirements-desktop.lock
          python -m pip install --no-deps -r deploy/packaging/requirements-desktop.lock
          python -m pip install --no-deps -r deploy/packaging/requirements-windows-runtime.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Require operator-published public Production Trust package
        shell: pwsh
        env:
          PRODUCTION_TRUST_ARTIFACT_RUN_ID: ${{ vars.STAGE9_PRODUCTION_TRUST_ARTIFACT_RUN_ID }}
        run: |
          if ($env:PRODUCTION_TRUST_ARTIFACT_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw "STAGE9_PRODUCTION_TRUST_ARTIFACT_RUN_ID is required; MSI promotion is blocked"
          }
      - name: Fetch operator-published public Production Trust package
        uses: actions/download-artifact@v8
        with:
          name: stage9-public-production-trust
          # The operator archive must contain the 12 JSON files directly at its
          # root. download-artifact materializes that root as this canonical ID.
          path: ${{ runner.temp }}/390299aaa1ea928a6c2bfdd81a4c50cfde82a7744cd054e8628d5937b90f1699
          run-id: ${{ vars.STAGE9_PRODUCTION_TRUST_ARTIFACT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and run canonical Stage-9 proof
        timeout-minutes: 90
        run: >-
          python -m deployment.windows_stage9_clean_install
          --version 0.1.0 --receipt dist/windows/windows-clean-install-receipt.json
          --production-trust-package "${{ runner.temp }}/390299aaa1ea928a6c2bfdd81a4c50cfde82a7744cd054e8628d5937b90f1699"
          --production-trust-artifact-run-id "${{ vars.STAGE9_PRODUCTION_TRUST_ARTIFACT_RUN_ID }}"
      - name: Produce revision-bound Stage-9 evidence
        run: >-
          python -m deployment.platform_evidence windows-clean-install
          --receipt dist/windows/windows-clean-install-receipt.json
          --msi dist/windows/CryptoHunter-0.1.0-windows-x64.msi
          --manifest dist/windows/installer-manifest.json
          --production-trust-package "${{ runner.temp }}/390299aaa1ea928a6c2bfdd81a4c50cfde82a7744cd054e8628d5937b90f1699"
          --output dist/windows/windows-clean-install-evidence.json
      - name: Preserve Stage-9 MSI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-clean-install-diagnostics
          if-no-files-found: ignore
          path: |
            dist/windows/windows-clean-install-receipt.json
            dist/windows/windows-clean-install-evidence.json
            dist/windows/installer-manifest.json
            dist/windows/logs/*.log
            dist/windows/logs/*.json
      - uses: actions/upload-artifact@v7
        with:
          name: windows-clean-install-evidence
          path: |
            dist/windows/installer-manifest.json
            dist/windows/windows-clean-install-receipt.json
            dist/windows/windows-clean-install-evidence.json
            dist/windows/logs/*.log
      - name: Promote exactly the qualified Stage-9 MSI
        uses: actions/upload-artifact@v7
        with:
          name: windows-stage9-qualified-msi
          if-no-files-found: error
          path: |
            dist/windows/CryptoHunter-0.1.0-windows-x64.msi
            dist/windows/installer-manifest.json
            dist/windows/windows-clean-install-receipt.json
            dist/windows/windows-clean-install-evidence.json

  windows-stage10-prepare-and-schedule-reboot:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe') && (github.event_name == 'workflow_dispatch' && inputs.run_stage10 == true)
    runs-on: [self-hosted, Windows, X64, cryptohunter-stage10]
    needs: [windows-deployment-integration, windows-clean-install-integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", architecture: "x64"}
      - uses: actions/download-artifact@v8
        with:
          name: windows-clean-install-evidence
          path: stage10-qualified
      - name: Capture same-host continuity state
        shell: pwsh
        run: >-
          ./deployment/windows_stage10_live.ps1 -Mode prepare-reboot
          -State stage10-continuity.json
          -QualifiedManifest stage10-qualified/installer-manifest.json
          -CleanInstallReceipt stage10-qualified/windows-clean-install-receipt.json
      - uses: actions/upload-artifact@v7
        with:
          name: stage10-continuity
          path: stage10-continuity.json
      - name: Schedule reboot after runner post-job cleanup
        shell: pwsh
        run: shutdown.exe /r /t 75 /d p:4:1 /c "CryptoHunter Stage-10 qualification"

  windows-stage10-reboot-barrier:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe') && (github.event_name == 'workflow_dispatch' && inputs.run_stage10 == true)
    needs: windows-stage10-prepare-and-schedule-reboot
    runs-on: ubuntu-latest
    steps:
      - name: Keep the rebooting host unavailable to the next job
        run: sleep 240

  windows-stage10-qualify-after-reboot:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe') && (github.event_name == 'workflow_dispatch' && inputs.run_stage10 == true)
    needs: windows-stage10-reboot-barrier
    runs-on: [self-hosted, Windows, X64, cryptohunter-stage10]
    timeout-minutes: 1800
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", architecture: "x64"}
      - uses: actions/download-artifact@v8
        with: {name: stage10-continuity, path: stage10}
      - name: Qualify reboot and the 24-hour lifecycle
        shell: pwsh
        run: |
          Start-Transcript -Path stage10/windows-stage10-transcript.log
          try {
            ./deployment/windows_stage10_live.ps1 -Mode qualify `
              -State stage10/stage10-continuity.json `
              -Output stage10/windows-stage10-receipt.json
          } finally {
            Stop-Transcript
          }
      - name: Produce same-run revision/runner/machine-bound LIVE evidence
        run: >-
          python -m deployment.platform_evidence windows-stage10
          --receipt stage10/windows-stage10-receipt.json
          --output stage10/windows-stage10-evidence.json
      - name: Preserve Stage-10 lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-stage10-lifecycle-evidence
          if-no-files-found: ignore
          path: |
            stage10/stage10-continuity.json
            stage10/windows-stage10-receipt.json
            stage10/windows-stage10-evidence.json
            stage10/windows-stage10-transcript.log

  linux-deployment-integration:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe') && (always() && (github.event_name == 'pull_request' || inputs.run_stage10 == true))
    runs-on: ubuntu-latest
    needs: [core-linux, core-windows, core-macos]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - &require_current_core_success
        name: Require successful current Core jobs
        shell: python
        env:
          CORE_LINUX_RESULT: ${{ needs.core-linux.result }}
          CORE_WINDOWS_RESULT: ${{ needs.core-windows.result }}
          CORE_MACOS_RESULT: ${{ needs.core-macos.result }}
        run: |
          import os
          required = ("CORE_LINUX_RESULT", "CORE_WINDOWS_RESULT", "CORE_MACOS_RESULT")
          if any(os.environ.get(name) != "success" for name in required):
              raise SystemExit("all current Core jobs must succeed before accepting artifacts")
      # Default artifact scope is this workflow run; never select a previous run.
      - uses: actions/download-artifact@v8
        with:
          name: core-evidence-Linux
          path: evidence/core-Linux
      - uses: actions/download-artifact@v8
        with:
          name: core-evidence-Windows
          path: evidence/core-Windows
      - uses: actions/download-artifact@v8
        with:
          name: core-evidence-macOS
          path: evidence/core-macOS
      - name: Aggregate revision-bound cross-OS core evidence for Linux
        run: >-
          python -m deployment.platform_evidence aggregate-core
          --source-revision "${{ github.sha }}"
          --marker evidence/core-Linux/core-Linux.json
          --marker evidence/core-Windows/core-Windows.json
          --marker evidence/core-macOS/core-macOS.json
          --output evidence/core-matrix.json
      - name: Enforce recorded Linux integration evidence
        run: >-
          python -m deployment.platform_readiness --platform LINUX
          --current-revision "${{ github.sha }}"
          --expected-ci-provider "${{ github.server_url }}"
          --expected-ci-run-id "${{ github.run_id }}"
          --evidence evidence/core-matrix.json

  macos-deployment-integration:
    name: macOS deployment compatibility (production deferred)
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe') && (github.event_name == 'pull_request' || inputs.run_stage10 == true)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - name: Install compatibility test dependencies
        run: python -m pip install pytest pyyaml
      # Native launchd/package/auth qualification remains frozen in policy V2.
      # Passing these tests never emits MACOS_PRODUCTION_READY or live evidence.
      - name: Enforce deferred macOS policy and deployment compatibility
        run: >-
          python -m pytest -q tests/deployment/test_platform_readiness.py
          tests/deployment/test_platform_evidence.py tests/deployment/test_core_test_plan.py

  windows-release-gate:
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.validation_scope != 'stage9-safe') && (always() && (github.event_name == 'pull_request' || inputs.run_stage10 == true))
    runs-on: windows-latest
    needs:
      - core-linux
      - core-windows
      - core-macos
      - windows-deployment-contract
      - windows-deployment-integration
      - windows-clean-install-integration
      - windows-stage10-prepare-and-schedule-reboot
      - windows-stage10-reboot-barrier
      - windows-stage10-qualify-after-reboot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - *require_current_core_success
      - uses: actions/download-artifact@v8
        with:
          pattern: core-evidence-*
          path: evidence
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: windows-clean-install-evidence
          path: evidence
      - uses: actions/download-artifact@v8
        with:
          name: windows-scm-evidence
          path: evidence
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_dispatch' && inputs.run_stage10 == true
        with:
          name: windows-stage10-lifecycle-evidence
          path: evidence
      - name: Aggregate revision-bound cross-OS core evidence
        run: >-
          python -m deployment.platform_evidence aggregate-core
          --marker evidence/core-Linux.json
          --marker evidence/core-Windows.json
          --marker evidence/core-macOS.json
          --output evidence/core-matrix.json
      - name: Enforce canonical Windows production readiness
        if: github.event_name != 'workflow_dispatch'
        run: >-
          python -m deployment.platform_readiness --release-profile WINDOWS_BETA
          --evidence evidence/core-matrix.json
          --evidence evidence/windows-scm-evidence.json
          --evidence evidence/windows-clean-install-evidence.json
      - name: Enforce canonical Windows production readiness with Stage-10 lifecycle
        if: github.event_name == 'workflow_dispatch' && inputs.run_stage10 == true
        run: >-
          python -m deployment.platform_readiness --release-profile WINDOWS_BETA
          --evidence evidence/core-matrix.json
          --evidence evidence/windows-scm-evidence.json
          --evidence evidence/windows-clean-install-evidence.json
          --evidence evidence/windows-stage10-evidence.json
