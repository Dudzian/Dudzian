name: Cleanup old artifacts

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete-old-artifacts:
    runs-on: ubuntu-24.04
    steps:
      # Retention policy for high-volume repositories:
      # - Never delete artifacts newer than 24h (safety buffer for active investigations).
      # - Keep the 50 most recently updated artifacts globally.
      # - Keep up to 3 most recent artifacts per artifact name (regardless of age).
      # - Keep everything updated in the last 7 days.
      # - Delete only artifacts older than 7 days that are not protected by global/name keepers.
      - name: Enforce artifact retention policy
        uses: actions/github-script@v9
        with:
          # Retry inventory atomically below. A failed/partial inventory is
          # never treated as empty; deletion starts only after full pagination.
          script: |
            const config = {
              retentionDays: 7,
              keepRecentGlobal: 50,
              keepPerName: 3,
              minAgeHoursToDelete: 24,
              sampleSize: 10,
            };

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const nowMs = Date.now();
            const msInHour = 60 * 60 * 1000;
            const msInDay = 24 * msInHour;
            const retentionCutoffMs = nowMs - config.retentionDays * msInDay;
            const freshCutoffMs = nowMs - config.minAgeHoursToDelete * msInHour;

            // The repository-level artifacts endpoint can persistently return 500
            // even with tiny pages. Never interpret that failure as an empty list.
            let allArtifacts;
            let inventoryMode = 'complete';
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                // Octokit paginate already normalizes {total_count, artifacts}
                // into an array of artifacts. Its map callback receives
                // response.data as an array, NOT response.data.artifacts.
                allArtifacts = await github.paginate(
                  github.rest.actions.listArtifactsForRepo,
                  { owner, repo, per_page: 50 }
                );
                break;
              } catch (error) {
                const status = error.status;
                const retryable = status === 429 || (status >= 500 && status <= 599);
                if (status === 429) {
                  // GitHub may throttle this maintenance task while CI is busy.
                  // Fail closed on data (zero deletes), but do not fail unrelated CI.
                  core.warning('Artifact cleanup deferred: repository inventory rate-limited (HTTP 429). No artifacts deleted.');
                  return;
                }
                if (!retryable) {
                  throw error;
                }
                if (attempt === 3) {
                  core.info('Repository artifact API repeatedly failed with 5xx; using safe run-level fallback');
                  break;
                }
                core.info(`Artifact inventory HTTP ${status}; retrying full inventory (${attempt}/3)`);
                await new Promise((resolve) => setTimeout(resolve, 1500 * attempt));
              }
            }

            if (!Array.isArray(allArtifacts)) {
              // Repository-wide artifact listing can return persistent HTTP 500.
              // Run-scoped retrieval is a *partial* snapshot: only remove an
              // observed old artifact when 50 DIFFERENT, strictly newer IDs
              // and 3 DIFFERENT strictly newer IDs of the same name prove
              // it is outside both keeper sets. Missing data only prevents
              // cleanup; it can never justify deletion.
              inventoryMode = 'verified-run-subset';
              try {
                // Freeze every UTC query window before enumeration. In the old
                // code a separate first-page count and a later paginate call
                // raced with newly-created CI runs, especially on today's date.
                const utcDay = Math.floor(nowMs / msInDay);
                const backlogOffset = 9 + ((utcDay * 2) % 82);
                const dayOffsets = [0, 1, 2, 7, 8, backlogOffset];
                const runIds = new Set();
                const runs = [];

                for (const offset of dayOffsets) {
                  const startMs = (utcDay - offset) * msInDay;
                  const endMs = Math.min(startMs + msInDay - 1, nowMs - 1);
                  const date = new Date(startMs).toISOString().slice(0, 10);
                  const created = new Date(startMs).toISOString() +
                    '..' + new Date(endMs).toISOString();
                  let expectedTotal = null;
                  let count = 0;
                  let page = 1;

                  while (true) {
                    const response = await github.rest.actions.listWorkflowRunsForRepo({
                      owner, repo, created, per_page: 100, page,
                    });
                    const total = response.data && response.data.total_count;
                    const batch = response.data && response.data.workflow_runs;
                    if (!Number.isSafeInteger(total) || total < 0 || total > 900 ||
                        !Array.isArray(batch) || batch.length > 100 ||
                        (expectedTotal !== null && total !== expectedTotal)) {
                      throw new Error('Incomplete workflow-run inventory for ' + date +
                        ' (unstable count, malformed page or >900 runs)');
                    }
                    expectedTotal = total;
                    count += batch.length;
                    if (count > total || (batch.length === 0 && count !== total)) {
                      throw new Error('Incomplete workflow-run inventory for ' + date +
                        ' (invalid page boundaries)');
                    }
                    for (const run of batch) {
                      const createdMs = Date.parse(run && run.created_at);
                      if (!Number.isSafeInteger(run && run.id) || run.id <= 0 ||
                          !Number.isFinite(createdMs) ||
                          createdMs < startMs || createdMs > endMs ||
                          runIds.has(run.id)) {
                        throw new Error('Incomplete workflow-run inventory for ' + date +
                          ' (invalid, duplicated or out-of-window run)');
                      }
                      runIds.add(run.id);
                      runs.push(run);
                    }
                    if (count === total) break;
                    if (batch.length !== 100 || page >= 9) {
                      throw new Error('Incomplete workflow-run inventory for ' + date +
                        ' (short or excessive pagination)');
                    }
                    page++;
                  }
                  core.info('Fallback window ' + date + ': ' + count +
                    ' runs (frozen UTC query, ' + page + ' pages)');
                }

                if (runs.length > 1200) {
                  throw new Error('Run-level artifact scan exceeds safe API budget');
                }

                // One run-scoped artifact listing per run, bounded concurrency.
                // Retries cover transient 5xx; failed/partial reads must not
                // produce a candidate set. Workers settle before returning.
                const batches = new Array(runs.length);
                let nextRun = 0;
                let inventoryFailure = null;
                const readRun = async () => {
                  while (nextRun < runs.length && inventoryFailure === null) {
                    const position = nextRun++;
                    try {
                      for (let attempt = 1; attempt <= 3; attempt++) {
                        try {
                          // Let Octokit return its normalized, fully
                          // paginated artifact array without a faulty mapper.
                          batches[position] = await github.paginate(
                            github.rest.actions.listWorkflowRunArtifacts,
                            { owner, repo, run_id: runs[position].id, per_page: 100 }
                          );
                          break;
                        } catch (error) {
                          const status = error && error.status;
                          if (!(status >= 500 && status <= 599) || attempt === 3) {
                            throw error;
                          }
                          await new Promise((resolve) =>
                            setTimeout(resolve, 1000 * attempt));
                        }
                      }
                    } catch (error) {
                      inventoryFailure = error;
                    }
                  }
                };
                await Promise.all(Array.from({ length: 8 }, () => readRun()));
                if (inventoryFailure !== null) throw inventoryFailure;

                // Distinct artifact IDs are mandatory for positive keeper proof.
                // A repeated ID must never count twice, even across reruns.
                const uniqueArtifacts = new Map();
                for (const batch of batches) {
                  if (!Array.isArray(batch) || batch.length > 2000) {
                    throw new Error('Incomplete run artifact inventory: missing or oversized batch');
                  }
                  for (const artifact of batch) {
                    const updatedMs = Date.parse(artifact && artifact.updated_at);
                    if (!Number.isSafeInteger(artifact && artifact.id) ||
                        artifact.id <= 0 ||
                        typeof artifact.name !== 'string' || !artifact.name ||
                        !Number.isFinite(updatedMs)) {
                      throw new Error('Incomplete run artifact inventory: malformed artifact');
                    }
                    if (uniqueArtifacts.has(artifact.id)) {
                      const previous = uniqueArtifacts.get(artifact.id);
                      if (previous.name !== artifact.name ||
                          previous.updated_at !== artifact.updated_at) {
                        throw new Error('Inconsistent duplicate artifact identity');
                      }
                      continue;
                    }
                    uniqueArtifacts.set(artifact.id, artifact);
                  }
                }
                allArtifacts = Array.from(uniqueArtifacts.values());
                if (runs.length >= 50 && allArtifacts.length === 0) {
                  throw new Error('Incomplete run artifact inventory: no artifacts found across large run subset');
                }
                // A successful fallback is informational; warn only when
                // inventory or deletion is genuinely deferred or fails.
                core.info(
                  'Safe fallback scanned ' + runs.length + ' runs and ' +
                  allArtifacts.length + ' distinct artifacts; all deletions ' +
                  'require independently observed newer-ID keeper proof'
                );
                core.info('Fallback backlog coverage: UTC day offset ' +
                  backlogOffset + ' (rotating 9-90 day window)');
              } catch (error) {
                const status = error && error.status;
                const message = error instanceof Error ? error.message : String(error);
                const unavailable = status === 429 ||
                  (status >= 500 && status <= 599);
                const safetyBoundary = /^(Incomplete workflow-run inventory for |Run-level artifact scan exceeds safe API budget|Incomplete run artifact inventory:|Inconsistent duplicate artifact identity)/.test(message);
                if (!unavailable && !safetyBoundary) throw error;
                core.warning(
                  'Artifact cleanup deferred (mode=verified-run-subset, HTTP ' +
                  (status || 'n/a') + ', cause=' +
                  (safetyBoundary ? message : 'GitHub API unavailable') +
                  '). No artifacts deleted; GitHub artifact expiration remains in effect.'
                );
                core.info('Cleanup outcome: DEFERRED_NO_DELETION; keeper rules unchanged.');
                return;
              }
            }
            if (!Array.isArray(allArtifacts)) {
              throw new Error('Artifact inventory never completed');
            }

            if (allArtifacts.length === 0) {
              core.info(`No artifacts found in ${inventoryMode} scan. Nothing to clean.`);
              return;
            }

            const artifacts = allArtifacts
              .filter((artifact) => artifact && artifact.id)
              .sort((a, b) => {
                const aMs = new Date(a.updated_at || 0).getTime();
                const bMs = new Date(b.updated_at || 0).getTime();
                return bMs - aMs;
              });

            const globalKeepIds = new Set(
              artifacts.slice(0, config.keepRecentGlobal).map((artifact) => artifact.id)
            );

            const perNameKeepIds = new Set();
            const perNameSeen = new Map();
            for (const artifact of artifacts) {
              const key = artifact.name || '__missing_name__';
              const count = perNameSeen.get(key) || 0;
              if (count < config.keepPerName) {
                perNameKeepIds.add(artifact.id);
                perNameSeen.set(key, count + 1);
              }
            }

            const kept = [];
            const deleteCandidates = [];

            for (const artifact of artifacts) {
              const updatedMs = new Date(artifact.updated_at).getTime();
              if (Number.isNaN(updatedMs)) {
                kept.push({
                  id: artifact.id,
                  name: artifact.name,
                  reason: 'invalid updated_at; kept defensively',
                });
                continue;
              }

              const ageDays = Math.floor((nowMs - updatedMs) / msInDay);

              if (updatedMs >= freshCutoffMs) {
                kept.push({ id: artifact.id, name: artifact.name, reason: 'fresh (<24h)', ageDays });
                continue;
              }

              if (globalKeepIds.has(artifact.id)) {
                kept.push({
                  id: artifact.id,
                  name: artifact.name,
                  reason: `within ${config.keepRecentGlobal} most recent globally`,
                  ageDays,
                });
                continue;
              }

              if (perNameKeepIds.has(artifact.id)) {
                kept.push({
                  id: artifact.id,
                  name: artifact.name,
                  reason: `within ${config.keepPerName} most recent for name`,
                  ageDays,
                });
                continue;
              }

              if (updatedMs >= retentionCutoffMs) {
                kept.push({
                  id: artifact.id,
                  name: artifact.name,
                  reason: `younger than ${config.retentionDays} days`,
                  ageDays,
                });
                continue;
              }

              if (inventoryMode === 'verified-run-subset') {
                // A partial snapshot cannot establish top-50/top-3 membership.
                // Strictly newer *observed* artifacts are positive proof that
                // this candidate is outside both protected keeper sets.
                const newer = artifacts.filter(
                  (other) => new Date(other.updated_at).getTime() > updatedMs
                );
                const newerSameName = newer.filter(
                  (other) => other.name === artifact.name
                );
                if (newer.length < config.keepRecentGlobal ||
                    newerSameName.length < config.keepPerName) {
                  kept.push({
                    id: artifact.id,
                    name: artifact.name,
                    reason: 'fallback: insufficient newer-artifact keeper proof',
                    ageDays,
                  });
                  continue;
                }
              }

              deleteCandidates.push({ id: artifact.id, name: artifact.name, ageDays });
            }

            const deleted = [];
            const failedDeletes = [];

            for (const candidate of deleteCandidates) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: candidate.id,
                });
                deleted.push(candidate);
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                failedDeletes.push({ ...candidate, error: message });
              }
            }

            const summarizeByReason = (items) => {
              const counts = new Map();
              for (const item of items) {
                counts.set(item.reason, (counts.get(item.reason) || 0) + 1);
              }
              return Array.from(counts.entries())
                .sort((a, b) => b[1] - a[1])
                .map(([reason, count]) => `${reason}: ${count}`)
                .join(', ');
            };

            const sample = (items, mapper) =>
              items.slice(0, config.sampleSize).map(mapper).join('; ') || 'none';

            core.info(`Inventory mode: ${inventoryMode}`);
            core.info(`Artifacts fetched: ${allArtifacts.length}`);
            core.info(`Artifacts considered: ${artifacts.length}`);
            core.info(`Kept (planned): ${kept.length}`);
            core.info(`Delete candidates: ${deleteCandidates.length}`);
            core.info(`Deleted successfully: ${deleted.length}`);
            core.info(`Delete failures: ${failedDeletes.length}`);

            core.info(`Keep reasons summary: ${summarizeByReason(kept) || 'none'}`);
            core.info(`Sample kept: ${sample(kept, (k) => `${k.name}#${k.id} (${k.reason})`)}`);
            core.info(`Sample delete candidates: ${sample(deleteCandidates, (d) => `${d.name}#${d.id} (${d.ageDays}d)`)}`);
            core.info(`Sample deleted: ${sample(deleted, (d) => `${d.name}#${d.id} (${d.ageDays}d)`)}`);

            if (failedDeletes.length > 0) {
              core.warning(
                `Sample delete failures: ${sample(failedDeletes, (f) => `${f.name}#${f.id} (${f.error})`)}`
              );
            }
