name: Cleanup old artifacts

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete-old-artifacts:
    runs-on: ubuntu-24.04
    steps:
      # Retention policy for high-volume repositories:
      # - Never delete artifacts newer than 24h (safety buffer for active investigations).
      # - Keep the 50 most recently updated artifacts globally.
      # - Keep up to 3 most recent artifacts per artifact name (regardless of age).
      # - Keep everything updated in the last 7 days.
      # - Delete only artifacts older than 7 days that are not protected by global/name keepers.
      - name: Enforce artifact retention policy
        uses: actions/github-script@v9
        with:
          # Retry inventory atomically below. A failed/partial inventory is
          # never treated as empty; deletion starts only after full pagination.
          script: |
            const config = {
              retentionDays: 7,
              keepRecentGlobal: 50,
              keepPerName: 3,
              minAgeHoursToDelete: 24,
              sampleSize: 10,
            };

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const nowMs = Date.now();
            const msInHour = 60 * 60 * 1000;
            const msInDay = 24 * msInHour;
            const retentionCutoffMs = nowMs - config.retentionDays * msInDay;
            const freshCutoffMs = nowMs - config.minAgeHoursToDelete * msInHour;

            // The repository-level artifacts endpoint can persistently return 500
            // even with tiny pages. Never interpret that failure as an empty list.
            let allArtifacts;
            let inventoryMode = 'complete';
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                allArtifacts = await github.paginate(
                  github.rest.actions.listArtifactsForRepo,
                  { owner, repo, per_page: 50 },
                  (response) => response.data.artifacts || []
                );
                break;
              } catch (error) {
                const status = error.status;
                const retryable = status === 429 || (status >= 500 && status <= 599);
                if (!retryable || status === 429) {
                  throw error;
                }
                if (attempt === 3) {
                  core.warning('Repository artifact API repeatedly failed with 5xx; using safe run-level fallback');
                  break;
                }
                core.warning(`Artifact inventory HTTP ${status}; retrying full inventory (${attempt}/3)`);
                await new Promise((resolve) => setTimeout(resolve, 1500 * attempt));
              }
            }

            if (!Array.isArray(allArtifacts)) {
              // A bounded, conservative fallback: inspect individual run artifacts
              // for recent proof (0-2d) and 7-8d deletion candidates. Only
              // delete an old artifact when >=50 *known newer* artifacts globally
              // AND >=3 *known newer* artifacts with the same name are found.
              // Unknown or unscanned artifacts are always protected.
              inventoryMode = 'verified-run-subset';
              const dayOffsets = [0, 1, 2, 7, 8];
              const runIds = new Set();
              const runs = [];
              for (const offset of dayOffsets) {
                const date = new Date(nowMs - offset * msInDay).toISOString().slice(0, 10);
                const params = { owner, repo, created: date, per_page: 100 };
                const first = await github.rest.actions.listWorkflowRunsForRepo(params);
                if (first.data.total_count > 900) {
                  throw new Error(`Run inventory for ${date} exceeds safe enumeration limit`);
                }
                const dayRuns = await github.paginate(
                  github.rest.actions.listWorkflowRunsForRepo,
                  params,
                  (response) => response.data.workflow_runs || []
                );
                if (dayRuns.length !== first.data.total_count) {
                  throw new Error(`Incomplete workflow-run inventory for ${date}`);
                }
                for (const run of dayRuns) {
                  if (run.id && !runIds.has(run.id)) {
                    runs.push(run);
                    runIds.add(run.id);
                  }
                }
              }
              if (runs.length > 1200) {
                throw new Error('Run-level artifact scan exceeds safe API budget');
              }

              // Bounded concurrency; a single failed run-artifact read aborts the
              // entire fallback before the first deletion can occur.
              const batches = new Array(runs.length);
              let nextRun = 0;
              const readRun = async () => {
                while (nextRun < runs.length) {
                  const position = nextRun++;
                  batches[position] = await github.paginate(
                    github.rest.actions.listWorkflowRunArtifacts,
                    { owner, repo, run_id: runs[position].id, per_page: 100 },
                    (response) => response.data.artifacts || []
                  );
                }
              };
              await Promise.all(Array.from({ length: 8 }, () => readRun()));
              allArtifacts = batches.flat();
              core.warning(
                `Safe fallback scanned ${runs.length} runs and ${allArtifacts.length} artifacts; ` +
                'only deletions independently proven outside both keeper sets are allowed'
              );
            }
            if (!Array.isArray(allArtifacts)) {
              throw new Error('Artifact inventory never completed');
            }

            if (allArtifacts.length === 0) {
              core.info(`No artifacts found in ${inventoryMode} scan. Nothing to clean.`);
              return;
            }

            const artifacts = allArtifacts
              .filter((artifact) => artifact && artifact.id)
              .sort((a, b) => {
                const aMs = new Date(a.updated_at || 0).getTime();
                const bMs = new Date(b.updated_at || 0).getTime();
                return bMs - aMs;
              });

            const globalKeepIds = new Set(
              artifacts.slice(0, config.keepRecentGlobal).map((artifact) => artifact.id)
            );

            const perNameKeepIds = new Set();
            const perNameSeen = new Map();
            for (const artifact of artifacts) {
              const key = artifact.name || '__missing_name__';
              const count = perNameSeen.get(key) || 0;
              if (count < config.keepPerName) {
                perNameKeepIds.add(artifact.id);
                perNameSeen.set(key, count + 1);
              }
            }

            const kept = [];
            const deleteCandidates = [];

            for (const artifact of artifacts) {
              const updatedMs = new Date(artifact.updated_at).getTime();
              if (Number.isNaN(updatedMs)) {
                kept.push({
                  id: artifact.id,
                  name: artifact.name,
                  reason: 'invalid updated_at; kept defensively',
                });
                continue;
              }

              const ageDays = Math.floor((nowMs - updatedMs) / msInDay);

              if (updatedMs >= freshCutoffMs) {
                kept.push({ id: artifact.id, name: artifact.name, reason: 'fresh (<24h)', ageDays });
                continue;
              }

              if (globalKeepIds.has(artifact.id)) {
                kept.push({
                  id: artifact.id,
                  name: artifact.name,
                  reason: `within ${config.keepRecentGlobal} most recent globally`,
                  ageDays,
                });
                continue;
              }

              if (perNameKeepIds.has(artifact.id)) {
                kept.push({
                  id: artifact.id,
                  name: artifact.name,
                  reason: `within ${config.keepPerName} most recent for name`,
                  ageDays,
                });
                continue;
              }

              if (updatedMs >= retentionCutoffMs) {
                kept.push({
                  id: artifact.id,
                  name: artifact.name,
                  reason: `younger than ${config.retentionDays} days`,
                  ageDays,
                });
                continue;
              }

              if (inventoryMode === 'verified-run-subset') {
                // A partial snapshot cannot establish top-50/top-3 membership.
                // Strictly newer *observed* artifacts are positive proof that
                // this candidate is outside both protected keeper sets.
                const newer = artifacts.filter(
                  (other) => new Date(other.updated_at).getTime() > updatedMs
                );
                const newerSameName = newer.filter(
                  (other) => other.name === artifact.name
                );
                if (newer.length < config.keepRecentGlobal ||
                    newerSameName.length < config.keepPerName) {
                  kept.push({
                    id: artifact.id,
                    name: artifact.name,
                    reason: 'fallback: insufficient newer-artifact keeper proof',
                    ageDays,
                  });
                  continue;
                }
              }

              deleteCandidates.push({ id: artifact.id, name: artifact.name, ageDays });
            }

            const deleted = [];
            const failedDeletes = [];

            for (const candidate of deleteCandidates) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: candidate.id,
                });
                deleted.push(candidate);
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                failedDeletes.push({ ...candidate, error: message });
              }
            }

            const summarizeByReason = (items) => {
              const counts = new Map();
              for (const item of items) {
                counts.set(item.reason, (counts.get(item.reason) || 0) + 1);
              }
              return Array.from(counts.entries())
                .sort((a, b) => b[1] - a[1])
                .map(([reason, count]) => `${reason}: ${count}`)
                .join(', ');
            };

            const sample = (items, mapper) =>
              items.slice(0, config.sampleSize).map(mapper).join('; ') || 'none';

            core.info(`Inventory mode: ${inventoryMode}`);
            core.info(`Artifacts fetched: ${allArtifacts.length}`);
            core.info(`Artifacts considered: ${artifacts.length}`);
            core.info(`Kept (planned): ${kept.length}`);
            core.info(`Delete candidates: ${deleteCandidates.length}`);
            core.info(`Deleted successfully: ${deleted.length}`);
            core.info(`Delete failures: ${failedDeletes.length}`);

            core.info(`Keep reasons summary: ${summarizeByReason(kept) || 'none'}`);
            core.info(`Sample kept: ${sample(kept, (k) => `${k.name}#${k.id} (${k.reason})`)}`);
            core.info(`Sample delete candidates: ${sample(deleteCandidates, (d) => `${d.name}#${d.id} (${d.ageDays}d)`)}`);
            core.info(`Sample deleted: ${sample(deleted, (d) => `${d.name}#${d.id} (${d.ageDays}d)`)}`);

            if (failedDeletes.length > 0) {
              core.warning(
                `Sample delete failures: ${sample(failedDeletes, (f) => `${f.name}#${f.id} (${f.error})`)}`
              );
            }
