name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        id: analyze
        with:
          category: "/language:${{ matrix.language }}"
      - name: Zachowaj ograniczony wynik reguły dla alertu 54
        if: matrix.language == 'python'
        env:
          SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ANALYSIS_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          query = "py/clear-text-logging-sensitive-data"
          target = "scripts/diagnose_stage9_stage41b_coexistence.py"
          directory = Path(os.environ["SARIF_DIRECTORY"])
          if not directory.is_absolute():
              raise SystemExit("Brak bezwzględnej ścieżki wyniku analizy")
          files = list(directory.glob("*.sarif"))
          if not files:
              raise SystemExit("Brak wyniku SARIF konfiguracji Python")
          present = False
          matched = 0
          unresolved = False
          for file in files:
              for run in json.loads(file.read_text(encoding="utf-8"))["runs"]:
                  rules = run["tool"]["driver"].get("rules", [])
                  present = present or any(rule.get("id") == query for rule in rules)
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId")
                      if rule_id is None and type(result.get("ruleIndex")) is int:
                          rule_id = rules[result["ruleIndex"]].get("id")
                      if rule_id != query:
                          continue
                      locations = result.get("locations", [])
                      unresolved = unresolved or not locations
                      for location in locations:
                          uri = location.get("physicalLocation", {}).get("artifactLocation", {}).get("uri")
                          if type(uri) is not str:
                              unresolved = True
                              continue
                          path = unquote(urlsplit(uri).path)
                          unresolved = unresolved or not path
                          matched += int(path == target or path.endswith("/" + target))
          report = {"schema_version": 1, "source_head": os.environ["SOURCE_HEAD"],
                    "analysis_revision": os.environ["ANALYSIS_REVISION"],
                    "rule_id": query, "target": target, "rule_present": present,
                    "unresolved_locations": unresolved, "target_location_count": matched}
          destination = Path(os.environ["RUNNER_TEMP"]) / "codeql-alert-54-summary.json"
          destination.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Udostępnij ograniczone potwierdzenie analizy alertu 54
        if: matrix.language == 'python'
        uses: actions/upload-artifact@v7
        with:
          name: codeql-alert-54-summary
          path: ${{ runner.temp }}/codeql-alert-54-summary.json
          if-no-files-found: error
          retention-days: 3
